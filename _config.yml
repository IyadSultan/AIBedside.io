title: AIBedside.io
description: >-
  SIOP 2026 Global Health Session companion site — a practical introduction
  to AI for the whole childhood-cancer team. King Hussein Cancer Center.
theme: minima
lang: en
author: Iyad Sultan
logo: /assets/img/android-chrome-512x512.png
twitter:
  card: summary

defaults:
  - scope:
      path: ""
    values:
      image: /assets/img/android-chrome-512x512.png
header_pages: []
show_excerpts: false

baseurl: "/AIBedside.io"
url: "https://iyadsultan.github.io"

markdown: kramdown
kramdown:
  input: GFM

plugins:
  - jekyll-relative-links

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - _sources/
  - node_modules/
  - vendor/
  - .bundle/
  - .playwright-mcp/
  - mcp-chat/
  - package.json
  - package-lock.json
  - .env
  - .env.example
  - tools/lock-key.mjs
